name: Reachy adapter checks
on:
  push:
    branches: [reachy-mini]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the versioned experimental image after tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Format check and build
        run: |
          test -z "$(gofmt -l internal/webrtc/reachy.go internal/webrtc/reachy_test.go internal/webrtc/reachy_media_test.go)"
          go build ./...
      - name: Reachy transport and lifecycle tests
        run: go test -race -v -count=3 -timeout=120s ./internal/webrtc -run TestReachy
      - name: Install independent media tester on cloud runner
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: RTSP picture integrity and resource cycles
        env:
          REACHY_MEDIA_TEST: '1'
        run: go test -v -count=1 -timeout=300s ./internal/webrtc -run 'TestReachy(PlaybackRTSP|ResourceCycles)$'
      - name: Existing WebRTC tests
        run: go test -timeout=120s ./pkg/webrtc
      - name: Build experimental container locally on cloud runner
        run: docker build -f docker/reachy.Dockerfile -t reachy-go2rtc:ci .
      - name: Container smoke test (no network)
        run: docker run --rm --network none --read-only reachy-go2rtc:ci -version

  publish:
    concurrency:
      group: reachy-image-publication
      cancel-in-progress: false
    needs: test
    if: contains(github.event.head_commit.message, '[publish-reachy]') || inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Read image version
        id: version
        run: |
          version="$(cat docker/REACHY_VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release tag
        env:
          IMAGE: ghcr.io/cuichaobaobao/reachy-go2rtc:${{ steps.version.outputs.value }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Version already exists; increment docker/REACHY_VERSION."
            exit 1
          fi
      - name: Build and publish both architectures
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/reachy.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/cuichaobaobao/reachy-go2rtc:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/cuichaobaobao/go2rtc
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
      - name: Verify published image by digest
        env:
          IMAGE: ghcr.io/cuichaobaobao/reachy-go2rtc
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker run --rm --network none --read-only "$IMAGE@$DIGEST" -version
          echo "Published: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: ${{ steps.version.outputs.value }} (experimental, robot untested)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check anonymous download availability
        env:
          IMAGE: ghcr.io/cuichaobaobao/reachy-go2rtc:${{ steps.version.outputs.value }}
        run: |
          public_config="$(mktemp -d)"
          if DOCKER_CONFIG="$public_config" docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Anonymous pull: available" >> "$GITHUB_STEP_SUMMARY"
            echo "Anonymous pull: available"
          else
            echo "Anonymous pull: unavailable; owner may need to set package visibility to public." >> "$GITHUB_STEP_SUMMARY"
            echo "Anonymous pull: unavailable; authenticated GHCR access required."
          fi
          rm -rf "$public_config"
