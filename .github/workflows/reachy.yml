name: Reachy adapter checks
on:
  push:
    branches: [reachy-mini]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Format check and build
        run: |
          gofmt -w internal/webrtc/reachy.go internal/webrtc/reachy_test.go
          go build ./...
      - name: Reachy transport and lifecycle tests
        run: go test -race -v -count=3 -timeout=120s ./internal/webrtc -run TestReachy
      - name: Existing WebRTC tests
        run: go test -timeout=120s ./pkg/webrtc
